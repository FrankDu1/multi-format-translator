server {
    listen 80;
    # 添加新域名到 server_name
    server_name offerupup.top www.offerupup.top offerupup.cn www.offerupup.cn;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS服务器块 — 主配置
server {
    listen 443 ssl http2;
    # 添加新域名到 server_name
    server_name offerupup.top www.offerupup.top offerupup.cn www.offerupup.cn;
    server_tokens off;

    # SSL证书配置（如果新域名使用不同的证书，需要修改）
    ssl_certificate /etc/letsencrypt/live/offerupup.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offerupup.top/privkey.pem;

    include /etc/nginx/ssl/ssl_params.conf;

    # ========================================
    # 🔥 翻译服务配置（新增）
    # ========================================
    
    # 🔧 修改为实际的 Docker 服务器 IP 地址
    set $translator_api_host "47.97.97.198:5002";
    set $translator_frontend_host "47.97.97.198:5001";
    
    # 翻译 API 后端（支持 CORS）
    location /translator-api/ {
        # CORS 预检请求处理
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass http://$translator_api_host/;
        proxy_http_version 1.1;
        
        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket 支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # CORS 响应头
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        
        # 超时设置
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        
        # 文件上传大小限制
        client_max_body_size 100M;
    }
    
    # 翻译前端（主页面）
    location = /trans {
        return 301 $scheme://$host/trans/;
    }
    
    location /trans/ {
        rewrite ^/trans/(.*)$ /$1 break;
        
        proxy_pass http://$translator_frontend_host;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # 支持 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_cache_bypass $http_upgrade;
    }
    
    # 翻译前端静态资源
    location /trans/static/ {
        proxy_pass http://$translator_frontend_host/static/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # OpenChatBox 反向代理
    # ========================================
    location /openchatbox/ {
        proxy_pass http://openchatbox:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header SCRIPT_NAME /openchatbox;
        rewrite ^/openchatbox/(.*)$ /$1 break;
    }

    # ========================================
    # WordPress 主站
    # ========================================
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}