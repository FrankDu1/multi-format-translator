server {
    listen 80;
    server_name offerupup.top www.offerupup.top offerupup.cn www.offerupup.cn;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name offerupup.top www.offerupup.top offerupup.cn www.offerupup.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/offerupup.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offerupup.top/privkey.pem;

    include /etc/nginx/ssl/ssl_params.conf;

    # ========================================
    # 🔥 翻译服务配置
    # ========================================
    
    set $translator_api_host "47.97.97.198:5002";
    set $translator_frontend_host "47.97.97.198:5001";
    
    # 🔥 静态资源直通（解决 /trans 路径下的资源加载问题）
    location ~ ^/static/ {
        proxy_pass http://$translator_frontend_host;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # API 后端（支持 CORS）
    location /translator-api/api/ {
        rewrite ^/translator-api(/api/.*)$ $1 break;
        proxy_pass http://$translator_api_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 100M;
    }
    
    # 翻译前端 - 主页面和所有资源（统一处理）
    location = /trans {
        return 301 $scheme://$host/trans/;
    }
    
    location /trans/ {
        # 去掉 /trans 前缀，代理到前端服务器
        rewrite ^/trans/(.*)$ /$1 break;
        
        proxy_pass http://$translator_frontend_host;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_cache_bypass $http_upgrade;
        
        # 静态资源缓存（仅对 CSS/JS/图片等）
        location ~ /trans/static/ {
            rewrite ^/trans/(.*)$ /$1 break;
            proxy_pass http://$translator_frontend_host;
            
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========================================
    # OpenChatBox
    # ========================================
    location /openchatbox/ {
        proxy_pass http://openchatbox:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header SCRIPT_NAME /openchatbox;
        rewrite ^/openchatbox/(.*)$ /$1 break;
    }

    # ========================================
    # WordPress 主站
    # ========================================
    location ~* ^/(robots\.txt|sitemap.*\.xml|.*\.xml)$ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        if ($request_uri ~* \.xml$) {
            add_header Content-Type "application/xml; charset=UTF-8" always;
        }
        if ($request_uri ~* robots\.txt$) {
            add_header Content-Type "text/plain; charset=UTF-8" always;
        }
    }

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }
}