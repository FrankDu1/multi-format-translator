name: Docker Build and Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

env:
  REGISTRY: ghcr.io
  # 注意：GHCR个人账户的包名格式为 ghcr.io/username/package-name
  # 不需要包含仓库名称
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: frontend
            context: ./translator_frontend
            dockerfile: ./translator_frontend/Dockerfile
            image: translator-frontend
          - name: api
            context: ./translator_api
            dockerfile: ./translator_api/Dockerfile
            image: translator-api
          - name: ocr
            context: ./ocr
            dockerfile: ./ocr/Dockerfile
            image: translator-ocr
          - name: inpaint
            context: ./inpaint
            dockerfile: ./inpaint/Dockerfile
            image: translator-inpaint
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4

      - name: 🔧 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 登录GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.image }}
          tags: |
            # 主分支推送 -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 分支名（如 develop）
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            # PR 标签
            type=ref,event=pr
            # 语义化版本标签（v1.2.3）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # commit hash（可选，用于精确回滚）
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}

      - name: 🏗️ 构建并推送 ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 📊 镜像信息
        run: |
          echo "### 🐳 Docker镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**服务:** ${{ matrix.service.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**镜像:** ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**标签:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

  test-compose:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4

      - name: 🔧 创建环境配置
        run: |
          cp .env.example .env || echo "No .env.example found"

      - name: 🚀 启动服务
        run: |
          docker compose up -d
          echo "等待服务启动..."
          sleep 60

      - name: 🔍 检查容器状态
        run: |
          echo "容器状态："
          docker compose ps
          
          echo -e "\n前端日志："
          docker compose logs frontend | tail -n 20
          
          echo -e "\nAPI日志："
          docker compose logs api | tail -n 20

      - name: 🧪 健康检查
        run: |
          echo "等待服务完全就绪..."
          for i in {1..30}; do
            if curl -sf http://localhost:5001 > /dev/null 2>&1; then
              echo "✓ 前端服务已就绪"
              break
            fi
            echo "前端服务未就绪，等待... ($i/30)"
            sleep 2
          done
          
          echo "检查前端服务..."
          curl -f http://localhost:5001 || (echo "前端服务检查失败" && docker compose logs frontend && exit 1)
          
          echo "检查API服务..."
          curl -f http://localhost:5002/api/health || (echo "API服务检查失败" && docker compose logs api && exit 1)
          
          # OCR和Inpaint服务是可选的，失败不影响主流程
          echo "检查OCR服务..."
          curl -f http://localhost:8899/health || echo "⚠️  OCR服务未响应（可能仍在启动）"
          
          echo "检查Inpaint服务..."
          curl -f http://localhost:8900/health || echo "⚠️  Inpaint服务未响应（可能仍在启动）"

      - name: 📋 查看日志
        if: failure()
        run: |
          docker compose logs

      - name: 🧹 清理
        if: always()
        run: |
          docker compose down -v

  create-release:
    needs: test-compose
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4

      - name: 📦 创建Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## 🐳 Docker镜像
            
            拉取镜像：
            ```bash
            docker pull ghcr.io/${{ github.repository }}/translator-frontend:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/translator-api:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/translator-ocr:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}/translator-inpaint:${{ github.ref_name }}
            ```
            
            或使用docker compose：
            ```bash
            docker compose up -d
            ```
            
            ## 📝 更新日志
            
            请查看下方的自动生成的更新说明。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
